# Mobile app checks (owned by A7). The admin panel (admin/) is not covered here.
name: CI

on:
  pull_request:
    branches: [migration/expo, main]
  push:
    branches: [migration/expo]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npx expo lint

      - name: Unit tests
        run: npx jest --ci

      - name: Prettier
        run: npm run format:check

      # TODO: drop continue-on-error once the React Native Directory check passes. It may still flag
      # react-native-draggable-flatlist and react-native-countdown-circle-timer (see STATUS.md).
      - name: expo-doctor
        run: npx expo-doctor
        continue-on-error: true

      - name: Bundle (Android and iOS)
        run: |
          npx expo export --platform android --output-dir /tmp/export-android
          npx expo export --platform ios --output-dir /tmp/export-ios
