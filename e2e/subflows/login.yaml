# Signs in with E2E_EMAIL / E2E_PASSWORD when the login screen is showing, then waits for the tabs.
# Safe to call when already signed in (the Supabase session survives launches). Skips onboarding if it shows.
appId: ${APP_ID}
---
- runFlow:
    when:
      visible:
        id: login.email
    commands:
      - tapOn:
          id: login.email
      - inputText: ${E2E_EMAIL}
      - tapOn:
          id: login.password
      - inputText: ${E2E_PASSWORD}
      - hideKeyboard
      - tapOn:
          id: login.submit
- extendedWaitUntil:
    visible:
      id: onboarding.screen
    timeout: 10000
  optional: true
- runFlow:
    when:
      visible:
        id: onboarding.screen
    commands:
      - tapOn:
          id: onboarding.skip
      - tapOn:
          id: onboarding.skip
      - tapOn:
          id: onboarding.skip
- extendedWaitUntil:
    visible:
      id: tab.workouts
    timeout: 30000
